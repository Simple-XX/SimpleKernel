# xtask — 内核构建工具
#
# 宿主机上运行的标准 Rust 程序，通过 `cargo xtask <subcommand>` 调用。
# 不受 #![no_std] 限制，可以使用完整的标准库。
#
# 使用方法:
#   cargo xtask build    [--arch riscv64|aarch64] [--release]
#   cargo xtask run      [--arch riscv64|aarch64] [--release]
#   cargo xtask debug    [--arch riscv64|aarch64] [--release]
#   cargo xtask firmware [--arch riscv64|aarch64]

[package]
name = "xtask"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
edition.workspace = true

[dependencies]
clap = { version = "4", default-features = false, features = ["derive", "std"] }
xshell = "0.2"
