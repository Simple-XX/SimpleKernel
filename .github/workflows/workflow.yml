# Copyright The SimpleKernel Contributors

name: build

on:
  - push
  - pull_request
  - release

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      packages: read
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: riscv64
        uses: devcontainers/ci@v0.3
        with:
          runCmd: |
            cmake --preset=build_riscv64
            cmake --build build_riscv64 --target SimpleKernel docs

      - name: riscv64 system test
        uses: devcontainers/ci@v0.3
        with:
          runCmd: |
            for i in $(seq 1 10); do
              echo "=== riscv64 System Test Run $i/10 ==="
              if ! timeout 300 cmake --build build_riscv64 --target system_test_run; then
                echo "riscv64 system test run $i/10 FAILED"
                exit 1
              fi
              echo "riscv64 system test run $i/10 passed"
            done

      - name: aarch64
        uses: devcontainers/ci@v0.3
        with:
          runCmd: |
            cmake --preset=build_aarch64 -DQEMU_NORMAL_WORLD_DEV_PATH=null -DQEMU_SECURE_WORLD_DEV_PATH=null
            cmake --build build_aarch64 --target SimpleKernel unit-test coverage

      - name: aarch64 system test
        uses: devcontainers/ci@v0.3
        with:
          runCmd: |
            for i in $(seq 1 10); do
              echo "=== aarch64 System Test Run $i/10 ==="
              timeout 300 cmake --build build_aarch64 --target system_test_run > /tmp/st_out_$i.txt 2>&1 || true
              cat /tmp/st_out_$i.txt
              if ! grep -q "Failed: 0" /tmp/st_out_$i.txt; then
                echo "aarch64 system test run $i/10 FAILED"
                exit 1
              fi
              echo "aarch64 system test run $i/10 passed"
            done

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ${{ github.workspace }}/build_riscv64/coverage/coverage.info
          verbose: true

      - name: Publish
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ github.workspace }}/docs/html
